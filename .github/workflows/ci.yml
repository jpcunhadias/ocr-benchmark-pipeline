name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check . --exclude .venv,notebooks

      - name: Format check (black)
        run: uv run black --check --diff . --exclude notebooks

      - name: Type check (mypy)
        run: uv run mypy src scripts streamlit_app tests run_local_pipeline.py

      - name: Run tests
        run: uv run pytest
