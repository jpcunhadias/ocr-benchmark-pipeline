services:
  mongo:
    image: mongo:7
    container_name: ocr-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: ocr_db
    volumes:
      - mongo_data:/data/db
    command:
      - mongod
      - --quiet
      - --setParameter
      - 'logComponentVerbosity={verbosity:0, network:{verbosity:0}}'
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 90s     # was 10s
      timeout: 5s
      retries: 2
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks: [ocr_net]


  postgres:
    image: postgres:16
    container_name: ocr-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ocr
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ocr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ocr_net]

  minio:
    image: quay.io/minio/minio:latest
    container_name: ocr-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.local
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
    profiles: ["local-s3"]
    networks: [ocr_net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11.13"
    container_name: ocr-app
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env.common
      - .env.local
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ocr_db
      MONGO_COLL: documents
      PG_URL: postgresql+psycopg2://app:app@postgres:5432/ocr
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [ocr_net]
    command: ["sleep", "infinity"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-api
    working_dir: /app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - .env.api.local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8080:8080"
    networks: [ocr_net]


  streamlit:
    build: .
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0
    ports: ["8501:8501"]
    environment:
      OCR_API_URL: "http://api:8080"   # use the **service name** on the Docker network
      OCR_API_KEY: "dev-secret"
    depends_on:
      api:
        condition: service_started
    networks: [ocr_net]

volumes:
  mongo_data:
  pg_data:
  minio_data:

networks:
  ocr_net:
