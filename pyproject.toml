[project]
name = "ocr-benchmark-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- OCR engines ---
    "pytesseract==0.3.13",
    "easyocr==1.7.1",
    # --- Evaluation ---
    "jiwer==4.0.0",
    # --- Utilities / imaging ---
    "opencv-python==4.10.0.84",
    "Pillow==10.4.0",
    "PyYAML==6.0.2",
    "tqdm==4.66.5",
    "numpy==2.0.2",
    "pdf2image==1.17.0",
    "psutil==6.0.0",
    "python-dotenv==1.0.1",
    # --- Data / files ---
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "fastparquet==2024.5.0",
    # --- Databases ---
    "pymongo==4.8.0",
    "motor==3.5.1",
    "SQLAlchemy==2.0.32",
    "psycopg2-binary==2.9.9",
    # --- Object storage ---
    "boto3==1.35.23",
    "botocore==1.35.23",
    "minio==7.2.7",
    # --- API ---
    "fastapi==0.114.1",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.0",
    "asyncpg>=0.29",
    # --- Dashboard ---
    "streamlit==1.56.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "black==24.8.0",
    "ruff==0.6.3",
    "pytest==9.1.1",
    "pre-commit==4.6.2",
]

[tool.uv]
# This is an application, not a publishable library -- src/ isn't laid out
# as an installable package (imports are `import src.xxx` off PYTHONPATH,
# not a package under src/<name>/). Tell uv to manage the venv/lockfile
# without trying to build and install the project itself as a wheel.
package = false

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by black)
    "N803",  # Argument name should be lowercase (pandas conventions)
    "N806",  # Variable in function should be lowercase (pandas conventions)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]  # Allow uppercase in test functions

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern calls Depends()/Query() in argument defaults by
# design; B008 doesn't know that convention and would otherwise flag every
# route handler.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
force-single-line = false
combine-as-imports = true

[tool.pytest.ini_options]
# Without this, `import src.xxx` only resolves when pytest is invoked as
# `python -m pytest` (which puts the CWD on sys.path) -- the bare `pytest`
# binary (what `uv run pytest` calls) does not, and fails with
# "ModuleNotFoundError: No module named 'src'".
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
