repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Whole-project run instead of per-changed-file: mypy needs full
        # cross-module context, and the hook's isolated env needs pydantic
        # installed for the pydantic.mypy plugin (configured in
        # pyproject.toml) to load at all.
        pass_filenames: false
        args: [src, scripts, streamlit_app, tests, run_local_pipeline.py]
        additional_dependencies: ["pydantic==2.9.0"]
